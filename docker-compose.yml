# Local development: build and run the API exactly like Cloud Run does.
#
#   docker compose up --build
#
# The server will be available at http://localhost:8080
# No credentials needed: this service has no Firebase key / secret (images are
# exchanged as base64, async state is in-memory).
services:
  identity-server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
