name: Deploy to Cloud Run

# CI/CD: on every push to main, build the image with Cloud Build (Kaniko layer
# caching via cloudbuild.yaml) and deploy it to Cloud Run. Mirrors update_docker.sh
# but runs automatically. First-time GCP resource creation is done manually with
# deploy_fresh_gcp.sh (which also creates the github-deployer SA used here).
# Homogeneous with rag/langchain: same Kaniko cloudbuild.yaml build path.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: robles-ai-identity-project
  REGION: us-central1
  REPO_NAME: my-repo
  SERVICE_NAME: identity-server
  IMAGE_NAME: identity-server
  RUNTIME_SA: cloud-run-sa@robles-ai-identity-project.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build image with Cloud Build (Kaniko cache)
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config cloudbuild.yaml .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:latest" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --max-instances=1 \
            --service-account="$RUNTIME_SA" \
            --set-env-vars="^|^ALLOWED_ORIGINS=https://robles.ai,https://www.robles.ai"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format="value(status.url)"
