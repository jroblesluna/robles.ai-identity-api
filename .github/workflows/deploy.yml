name: Deploy to Cloud Run

# CI/CD: on every push to main, build the image with Cloud Build and deploy
# it to Cloud Run. Mirrors update_docker.sh but runs automatically.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

env:
  PROJECT_ID: identityverifierapp
  REGION: us-central1
  REPO_NAME: my-repo
  SERVICE_NAME: identity-server
  IMAGE_NAME: identity-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using a service account key stored in the
      # GCP_SA_KEY GitHub secret (JSON). See setup notes in the PR/README.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --max-instances=2 \
            --set-env-vars="STORAGE_BUCKET_NAME=identityverifierapp.firebasestorage.app,ALLOWED_ORIGINS=https://robles.ai,https://www.robles.ai" \
            --set-secrets="/secrets/FIREBASE_KEY=FIREBASE_KEY:1"

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format="value(status.url)"
