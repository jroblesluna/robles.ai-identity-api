name: Deploy to Cloud Run

# CI/CD: on every push to main, build the image ON THE RUNNER with docker and
# push it to Artifact Registry, then deploy to Cloud Run. First-time GCP resource
# creation is done manually with deploy_fresh_gcp.sh (which also creates the
# github-deployer SA used here). Homogeneous with rag/langchain.
#
# NOTE: we build with `docker build` on the runner instead of `gcloud builds
# submit` (Cloud Build). Under this org, the github-deployer SA is blocked from
# using Cloud Build's staging bucket ("forbidden from accessing the bucket
# ..._cloudbuild"), so building on the runner and pushing directly to Artifact
# Registry sidesteps that org restriction entirely. deploy_fresh_gcp.sh still
# uses Cloud Build locally (run as the owner, who is allowed).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: robles-ai-identity-project
  REGION: us-central1
  REPO_NAME: identity-api-repo
  SERVICE_NAME: identity-server
  IMAGE_NAME: identity-server
  RUNTIME_SA: cloud-run-sa@robles-ai-identity-project.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build & push image (docker on runner → Artifact Registry)
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --image="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$GITHUB_SHA" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --max-instances=1 \
            --service-account="$RUNTIME_SA" \
            --set-env-vars="^|^ALLOWED_ORIGINS=https://robles.ai,https://www.robles.ai"

      - name: Prune old images from Artifact Registry
        continue-on-error: true
        run: bash prune_registry.sh

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format="value(status.url)"
